<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Vuoronumeron arvauspeli</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <h1>Vuoronumeron arvauspeli</h1>

    <section aria-labelledby="playerHeading">
      <h2 id="playerHeading">Pelaaja</h2>

      <label for="playerName">Nimimerkki</label>

      <input
        id="playerName"
        type="text"
        minlength="1"
        maxlength="20"
        required
        autocomplete="nickname"
        placeholder="Kirjoita nimimerkki"
      >

      <button id="registerButton" type="button">
        Rekisteröi uusi pelaaja
      </button>

      <p id="playerMessage" aria-live="polite">
        Pelaajaa ei ole rekisteröity.
      </p>
    </section>

    <section aria-labelledby="gameHeading">
      <h2 id="gameHeading">Peli</h2>

      <button id="newGameButton" type="button">
        Aloita uusi peli
      </button>

      <label for="guessInput">
        Arvaa luku väliltä 1–100
      </label>

      <input
        id="guessInput"
        type="number"
        min="1"
        max="100"
        step="1"
        required
        inputmode="numeric"
        placeholder="1–100"
        disabled
      >

      <button id="guessButton" type="button" disabled>
        Arvaa
      </button>

      <h3>Tähän tulevat arvaukset</h3>

      <ol id="guessHistory" aria-live="polite"></ol>
    </section>

    <section aria-labelledby="scoreHeading">
      <h2 id="scoreHeading">Tässä on pistetaulukko</h2>

      <table>
        <thead>
          <tr>
            <th scope="col">Nimimerkki</th>
            <th scope="col">Arvauksia</th>
          </tr>
        </thead>

        <tbody id="scoreTableBody"></tbody>
      </table>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
